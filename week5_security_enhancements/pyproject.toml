[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "securenotes-week5"
version = "1.0.0"
description = "Week 5 security-hardening case study: vulnerable baseline to hardened SecureNotes CLI"
requires-python = ">=3.10"
dependencies = ["cryptography>=42"]

[tool.setuptools.packages.find]
include = ["securenotes*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
markers = [
    "attack: quarantined vulnerable-baseline demonstrations that intentionally succeed",
    "security: attack-resistance and security-control tests",
    "functionality: normal user behaviour remains correct after hardening",
]
